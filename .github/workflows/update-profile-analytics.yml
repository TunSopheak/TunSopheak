name: Update profile analytics

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_profile_analytics.py
      - .github/workflows/update-profile-analytics.yml
  schedule:
    # Every 6 hours at minute 23 UTC → 07:23, 13:23, 19:23, 01:23 Cambodia time
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: TunSopheak
        run: python scripts/generate_profile_analytics.py

      - name: Commit only when analytics changed
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-analytics.svg; then
            echo "No analytics data changed; skipping commit."
            exit 0
          fi

          # Update cache-busting query in README
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          token = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          text = re.sub(
              r"profile-analytics\.svg\?v=\d+",
              f"profile-analytics.svg?v={token}",
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-analytics.svg README.md
          git commit -m "chore: refresh profile analytics"
          git push
