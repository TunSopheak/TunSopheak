name: Update profile analytics

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_profile_analytics.py
      - .github/workflows/update-profile-analytics.yml
  schedule:
    # 17:23 UTC = 00:23 in Cambodia (UTC+7)
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live analytics SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: TunSopheak
        run: python scripts/generate_profile_analytics.py

      - name: Commit refreshed analytics when changed
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-analytics.svg; then
            echo "Analytics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-analytics.svg
          git commit -m "chore: refresh profile analytics"
          git push
