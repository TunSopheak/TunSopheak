<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tun Sopheak — Backend Developer &amp; CS Student</title>
  <desc id="desc">Modern profile banner highlighting backend development focus with Java, Spring Boot, and Python.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#15112a"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    
    <!-- Glow Effects -->
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#d97706" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#a371f7" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="soft">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b949e" stroke-opacity=".06"/>
    </pattern>

    <style>
      .name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #f0f6fc; letter-spacing: -1px; }
      .role { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 650; fill: #dbeafe; }
      .focus { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #fbbf24; }
      .quote { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #9fb6d0; }
      
      .badge-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #3fb950; letter-spacing: 0.8px; }
      .chip-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 650; fill: #dbeafe; }
      
      .term-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .term-key { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #c792ea; }
      .term-string { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #c3e88d; }
      .term-var { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #89ddff; }
      .term-comment { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #676e79; }
      .term-dim { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #7d8da1; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <!-- Animated Glows -->
  <circle cx="160" cy="40" r="240" fill="url(#glow1)" filter="url(#soft)">
    <animate attributeName="cx" values="120;200;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="340" r="260" fill="url(#glow2)" filter="url(#soft)">
    <animate attributeName="cy" values="340;260;340" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: PROFILE INFO                 -->
  <!-- ========================================== -->
  <g transform="translate(60 60)">
    
    <!-- Open to Work Badge -->
    <g transform="translate(0 0)">
      <rect width="220" height="30" rx="15" fill="#1a2a1a" stroke="#3fb950" stroke-width="1.5"/>
      <circle cx="18" cy="15" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" class="badge-text">OPEN TO WORK</text>
    </g>

    <!-- Name -->
    <text x="0" y="90" class="name">Tun Sopheak</text>
    
    <!-- Role -->
    <text x="0" y="132" class="role">Backend Developer &amp; CS Student</text>
    
    <!-- Divider Line -->
    <rect x="0" y="154" width="520" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- Tagline -->
    <text x="0" y="192" class="focus">Java · Spring Boot · Python · PostgreSQL</text>
    <text x="0" y="226" class="quote">Building scalable backend systems with clean code and modern tools.</text>

    <!-- Chips -->
    <g transform="translate(0 258)">
      <rect width="88" height="34" rx="17" fill="#161f2f" stroke="#2d425c"/>
      <text x="44" y="22" text-anchor="middle" class="chip-text">RUPP</text>

      <rect x="100" width="112" height="34" rx="17" fill="#161f2f" stroke="#2d425c"/>
      <text x="156" y="22" text-anchor="middle" class="chip-text">Cambodia</text>

      <rect x="224" width="178" height="34" rx="17" fill="#161f2f" stroke="#2d425c"/>
      <text x="313" y="22" text-anchor="middle" class="chip-text">Backend · API · DB</text>
    </g>

  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: TERMINAL WINDOW             -->
  <!-- ========================================== -->
  <g transform="translate(790 56)">
    
    <!-- Window Background (Simplified – no clipPath) -->
    <rect width="400" height="248" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="380" height="42" rx="12" ry="12" fill="#161b22"/>
    <rect x="0" y="30" width="380" height="12" fill="#161b22"/>
    
    <!-- Window Controls -->
    <circle cx="18" cy="21" r="5" fill="#ff7b72"/>
    <circle cx="36" cy="21" r="5" fill="#d29922"/>
    <circle cx="54" cy="21" r="5" fill="#3fb950"/>
    
    <!-- Filename -->
    <text x="190" y="26" text-anchor="middle" class="term-header">backend.ts</text>

    <!-- Code Line 1 -->
    <text x="24" y="80" class="term-key">import</text>
    <text x="84" y="80" class="term-dim">{</text>
    <text x="94" y="80" class="term-var">Java</text>
    <text x="136" y="80" class="term-dim">,</text>
    <text x="144" y="80" class="term-var">Spring Boot</text>
    <text x="244" y="80" class="term-dim">}</text>
    <text x="254" y="80" class="term-key">from</text>
    <text x="296" y="80" class="term-string">'@core'</text>
    <text x="348" y="80" class="term-dim">;</text>

    <!-- Code Line 2 -->
    <text x="24" y="116" class="term-key">const</text>
    <text x="74" y="116" class="term-dim"> focus = [</text>
    <text x="148" y="116" class="term-string">"APIs"</text>
    <text x="196" y="116" class="term-dim">,</text>
    <text x="204" y="116" class="term-string">"Databases"</text>
    <text x="288" y="116" class="term-dim">,</text>
    <text x="296" y="116" class="term-string">"Scalability"</text>
    <text x="388" y="116" class="term-dim">];</text>

    <!-- Code Line 3 -->
    <text x="24" y="152" class="term-key">const</text>
    <text x="74" y="152" class="term-dim"> direction = </text>
    <text x="170" y="152" class="term-string">"Software Engineering"</text>
    <text x="352" y="152" class="term-dim">;</text>

    <!-- Code Line 4 -->
    <text x="24" y="200" class="term-comment">// build · learn · improve · repeat</text>
    
    <!-- Animated Loading Bar -->
    <rect x="24" y="218" width="118" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="30;280;118" dur="5s" repeatCount="indefinite"/>
    </rect>
    
  </g>

  <!-- Floating Particles -->
  <g fill="#fbbf24" opacity=".5">
    <circle cx="680" cy="45" r="3">
      <animate attributeName="cy" values="45;65;45" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="85" r="3.5">
      <animate attributeName="cy" values="85;65;85" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="320" r="3">
      <animate attributeName="cx" values="720;740;720" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="320" r="2.5">
      <animate attributeName="cy" values="320;305;320" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1200" height="358" rx="27" fill="none" stroke="#2f3f57" stroke-width="1.5"/>
</svg>
