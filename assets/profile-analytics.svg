<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
  <title id="title">TunSopheak GitHub analytics</title>
  <desc id="desc">Public contribution summary, weekly trend, and repository language distribution for @TunSopheak.</desc>

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Line gradient -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>

    <!-- Area fill -->
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Soft card glow -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title        { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 28px; font-weight: 750; fill: #f0f6fc; }
      .subtitle     { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #8b949e; }
      .metric       { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 32px; font-weight: 750; fill: #f0f6fc; }
      .metricLabel  { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 650; fill: #8b949e; letter-spacing: 0.8px; }
      .section      { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #c9d1d9; }
      .axis         { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 500; fill: #6e7681; }
      .language     { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #c9d1d9; }
      .percent      { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .footer       { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 500; fill: #6e7681; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1040" height="800" rx="24" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Soft decorative glow -->
  <circle cx="920" cy="70" r="140" fill="#1f6feb" opacity="0.08"/>

  <!-- ========== HEADER ========== -->
  <text x="44" y="52" class="title">GitHub Activity</text>
  <text x="44" y="78" class="subtitle">Public activity for @TunSopheak · Generated inside this repository</text>
  <text x="996" y="52" class="subtitle" text-anchor="end">Last refreshed · 29 Aug 2026</text>

  <!-- ========== METRIC CARDS ========== -->
  <!-- Card 1 -->
  <rect x="44" y="108" width="226" height="108" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="66" y="154" class="metric">382</text>
  <text x="66" y="186" class="metricLabel">CONTRIBUTIONS</text>

  <!-- Card 2 -->
  <rect x="286" y="108" width="226" height="108" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="308" y="154" class="metric">35</text>
  <text x="308" y="186" class="metricLabel">ACTIVE DAYS</text>

  <!-- Card 3 -->
  <rect x="528" y="108" width="226" height="108" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="154" class="metric">6 days</text>
  <text x="550" y="186" class="metricLabel">LONGEST STREAK</text>

  <!-- Card 4 -->
  <rect x="770" y="108" width="226" height="108" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="792" y="154" class="metric">3 days</text>
  <text x="792" y="186" class="metricLabel">CURRENT STREAK</text>

  <!-- ========== CONTRIBUTION TREND ========== -->
  <text x="44" y="252" class="section">Contribution trend · latest 26 weeks</text>

  <rect x="44" y="266" width="952" height="286" rx="18" fill="#161b22" stroke="#30363d"/>

  <!-- Grid lines + Y labels -->
  <line x1="78" y1="286" x2="968" y2="286" stroke="#21262d"/>
  <text x="64" y="290" class="axis" text-anchor="end">95</text>

  <line x1="78" y1="344" x2="968" y2="344" stroke="#21262d"/>
  <text x="64" y="348" class="axis" text-anchor="end">71</text>

  <line x1="78" y1="402" x2="968" y2="402" stroke="#21262d"/>
  <text x="64" y="406" class="axis" text-anchor="end">48</text>

  <line x1="78" y1="460" x2="968" y2="460" stroke="#21262d"/>
  <text x="64" y="464" class="axis" text-anchor="end">24</text>

  <line x1="78" y1="518" x2="968" y2="518" stroke="#21262d"/>
  <text x="64" y="522" class="axis" text-anchor="end">0</text>

