           L 938.2 452.8 
           L 974.0 480.0 
           L 974.0 518.0 
           L 78.0 518.0 Z" 
        fill="url(#area)"/>

  <path d="M 78.0 518.0 
           L 113.8 474.5 
           L 149.7 518.0 
           L 185.5 518.0 
           L 221.4 518.0 
           L 257.2 518.0 
           L 293.0 518.0 
           L 328.9 518.0 
           L 364.7 518.0 
