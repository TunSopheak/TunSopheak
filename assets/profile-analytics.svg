           L 508.1 518.0 
           L 543.9 518.0 
           L 579.8 518.0 
           L 615.6 268.1 
           L 651.4 287.2 
           L 687.3 287.2 
           L 723.1 518.0 
           L 759.0 428.4 
           L 794.8 515.3 
           L 830.6 509.9 
           L 866.5 444.7 
           L 902.3 512.6 
           L 938.2 452.8 
           L 974.0 480.0" 
        fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <g fill="#79c0ff" stroke="#0d1117" stroke-width="2">
    <circle cx="78.0"  cy="518.0" r="3.2"/>
    <circle cx="113.8" cy="474.5" r="3.2"/>
    <circle cx="149.7" cy="518.0" r="3.2"/>
