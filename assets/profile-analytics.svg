<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
  <title id="title">GitHub analytics initialization</title>
  <desc id="desc">The automatic GitHub Actions workflow will replace this image with live analytics after its first successful run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  </defs>
  <rect width="1040" height="720" rx="24" fill="url(#bg)" stroke="#30363d"/>
  <rect x="40" y="40" width="960" height="640" rx="20" fill="#161b22" stroke="#30363d"/>
  <circle cx="520" cy="295" r="70" fill="none" stroke="#21262d" stroke-width="14"/>
  <path d="M520 225 A70 70 0 0 1 584 323" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <text x="520" y="410" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Preparing live GitHub analytics</text>
  <text x="520" y="452" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="18">The first GitHub Actions run will generate the contribution line chart.</text>
  <text x="520" y="488" text-anchor="middle" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="16">Repository → Actions → Update profile analytics</text>
</svg>
