  <!-- X-axis labels -->
  <text x="78"   y="544" class="axis" text-anchor="middle">Mar 07</text>
  <text x="257"  y="544" class="axis" text-anchor="middle">Apr 11</text>
  <text x="436"  y="544" class="axis" text-anchor="middle">May 16</text>
