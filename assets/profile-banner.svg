    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="1035" cy="65" r="145" fill="#1f6feb" opacity="0.18" filter="url(#glow)"/>
  <circle cx="110" cy="300" r="165" fill="#58a6ff" opacity="0.1" filter="url(#glow)"/>
  <path d="M0 270 C210 220 330 330 545 274 C755 220 930 305 1200 228 L1200 330 L0 330 Z" fill="#58a6ff" opacity="0.08"/>
