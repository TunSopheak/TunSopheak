  <text x="112" y="125" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750">Tun Sopheak</text>
  <text x="114" y="175" fill="#79c0ff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="1">COMPUTER SCIENCE · SOFTWARE DEVELOPMENT</text>
  <text x="114" y="218" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="22">Backend · Mobile · AI / Computer Vision · IoT · Software Engineering</text>
  <g transform="translate(114 247)">
