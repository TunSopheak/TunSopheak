<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Tun Sopheak core technologies and learning direction</title>
<desc id="desc">A focused technology map for web, backend, relational databases, tools, Docker, and MongoDB learning.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2d"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#39d0d8"/></linearGradient>
  <linearGradient id="learn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8b949e" stroke-opacity=".055"/></pattern>
  <style>
    .title{font-family:'Segoe UI',Arial,sans-serif;font-size:30px;font-weight:800;fill:#f0f6fc}
    .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:500;fill:#8fa3ba}
    .group{font-family:'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:750;fill:#dbeafe}
    .chip{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:650;fill:#e6edf3}
    .small{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:550;fill:#9fb2c8}
    .focus{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:750;fill:#c4f1ff;letter-spacing:.5px}
    .learnTitle{font-family:'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:800;fill:#fff}
    .learnText{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:600;fill:#e0e7ff}
    .mark{font-family:Consolas,'Courier New',monospace;font-size:13px;font-weight:800;fill:#07111f}
  </style>
</defs>
<rect width="1200" height="630" rx="26" fill="url(#bg)"/>
<rect width="1200" height="630" rx="26" fill="url(#grid)"/>
<circle cx="1080" cy="50" r="170" fill="#2563eb" opacity=".10"/>
<circle cx="120" cy="600" r="180" fill="#7c3aed" opacity=".08"/>
